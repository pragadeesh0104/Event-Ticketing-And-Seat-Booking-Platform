name: Eventify Continuous Integration Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend Build & JUnit Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: event_booking_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Spring Boot Backend
        run: |
          cd backend
          mvn clean verify -DDB_HOST=localhost -DDB_PORT=3306 -DDB_NAME=event_booking_db -DDB_USERNAME=root -DDB_PASSWORD=root

  frontend-build:
    name: Frontend Production Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build React Application
        run: |
          cd frontend
          npm ci || npm install
          npm run build
